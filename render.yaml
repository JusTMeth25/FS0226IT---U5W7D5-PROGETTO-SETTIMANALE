# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.

databases:
  - name: salone-db
    databaseName: salone
    user: salone
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: salone-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salone-db
          property: connectionString
      # Origine del FE per il CORS, es. https://salone-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Firma dei JWT: Render genera un valore casuale al primo deploy.
      - key: JWT_SECRET
        generateValue: true
      # Amministratore creato al primo avvio (password di almeno 8 caratteri).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Mail: il piano free di Render blocca l'SMTP in uscita, quindi si usa
      # l'API HTTPS di Mailjet. MAIL_USERNAME = mittente verificato su Mailjet.
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      # Indirizzo del FE per il link "disattiva avviso" nella mail, senza / finale.
      - key: FRONTEND_URL
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: salone-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://salone-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
